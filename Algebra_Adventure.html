<style>

ze:15px}nav button.active{background:var(--green);color:white}.num{border-radius:50%;background:#e5e9e1;color:var(--ink);min-width:29px;height:29px;display:grid;place-items:center}nav button.done .num{background:#f0c776}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:20px}.tint{background:var(--mint);border:0}.math{font-family:ui-rounded,system-ui,sans-serif;font-size:clamp(24px,3vw,34px);font-weight:700;letter-spacing:.3px;line-height:1.4;overflow-wrap:anywhere}.equation{background:var(--paper);padding:20px;border-radius:15px;text-align:center;margin:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.small{font-size:14px;color:var(--muted)}.callout{border-left:4px solid var(--orange);padding:5px 17px;margin:20px 0}.steps{padding-left:24px}.steps li{padding:8px 0 8px 8px}.steps strong{display:block;font-size:21px}.feedback{padding:12px 15px;border-radius:10px;background:#f1f4ef;min-height:49px;margin:14px 0}.good{background:#e1f1e4;color:#175032}.try{background:#fff0d8;color:#684210}.progress{height:7px;background:#e0e6dd;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--green)}summary{cursor:pointer;font-weight:750}details{margin:18px 0}details p,details li{font-size:15px}.pans{display:grid;grid-template-columns:1fr 55px 1fr;align-items:center;text-align:center;gap:8px;margin:20px 0}.pan{border-bottom:5px solid var(--green);border-radius:15px;background:var(--mint);padding:18px 8px;transition:transform .3s}.pan .math{font-size:38px}.tokens{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:10px}.token{width:12px;height:12px;background:var(--green);border-radius:50%}.log{max-height:170px;overflow:auto;padding-left:22px;font-size:15px}.bars{margin:20px 0}.barrow{display:flex;align-items:center;gap:7px;margin:9px 0}.barlabel{width:80px;font-size:14px;flex:none}.bar{display:flex;max-width:490px;flex:1;height:46px}.part{background:var(--mint);border:2px solid var(--green);display:flex;justify-content:center;align-items:center;font-weight:750;min-width:35px}.extra{background:#f9dfb0;border-color:#b07b2c}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px}#guide{display:none}.hidden{display:none!important}.printOnly{display:none}.counter{font-size:13px;font-weight:750;color:var(--green)}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{position:static;display:flex;gap:5px;overflow:auto;padding-bottom:10px}nav button{width:auto;min-width:150px;margin:0}.hero{grid-template-columns:1fr}.heroArt{display:none}header{flex-wrap:wrap;padding:15px 20px}.card{padding:20px}main{padding:20px 15px}.hero{margin-top:0}h1{letter-spacing:-1px}}@media print{header,nav,.hero,#lesson,.footer,.noPrint{display:none!important}#guide{display:block!important}.layout{display:block}.card{break-inside:avoid;border:0;padding:8px}.printOnly{display:block}body{font-size:12px;background:white}h1{font-size:28px}h2{font-size:22px}main{padding:0}}
</style></head><body>
<header><div class="brand">Algebra Adventure <span class="badge">Offline edition</span></div><div class="row"><label for="learner" class="small">Explorer</label><select id="learner"><option>Quinn</option><option>Reagan</option><option>Guest</option></select><button id="guideToggle">Grown-up guide</button></div></header>
<main><section class="hero"><div><div class="eyebrow">Small steps. Big ideas.</div><h1>The same on<br>both sides.</h1><p>Algebra is a way to find a mystery number. Your superpower? Keep both sides equal as you figure it out.</p></div><div class="heroArt"><div class="eyebrow">One rule to remember</div><div class="math">2 + 5 = 2 + 5</div><p>Same value. Different adventures.</p><span class="badge">Think · Try · Explain · Check</span></div></section>
<div class="layout"><nav id="nav" aria-label="Lessons"></nav><div><section id="lesson" aria-live="polite"></section><section id="guide"></section><p class="small" id="storageNote"></p></div></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const lessons=[
{title:'What equals means',tag:'01 / Equality',goal:'Read the equals sign as “has the same value as.”',text:'An equals sign is a promise: the amount on the left is exactly the amount on the right. It does not mean “the answer comes next.”',start:'2 = 2',steps:[['2 + 5 = 2 + 5','Add five to BOTH sides. Both sides now have a value of seven.'],['2 + 5 = 5 + 2','We can also swap the order of the numbers being added. This is a different idea: the total stays seven.'],['7 = 7','Work out each side. Our promise is still true!']],note:'You can read an equation either way: 5 = 3 + 2 is just as true as 3 + 2 = 5.',ask:'What does the equals sign promise?',lab:'balance'},
{title:'Keep it balanced',tag:'02 / Both sides',goal:'Change an equation without breaking its promise.',text:'If two amounts are equal, adding the same number to each keeps them equal. Subtracting the same number from each works too.',start:'10 = 10',steps:[['10 − 2 = 10 − 2','Take away two from each side.'],['8 = 8','Both sides are still equal.'],['8 + 3 = 8 + 3','Add three to each side.'],['11 = 11','Equal again. The amounts changed, but the equality stayed true.']],note:'Try changing only one side in the playground. What happens? Then undo your move or fix the other side.',ask:'Why is adding two to just one side different?',lab:'balance'},
{title:'Meet the mystery',tag:'03 / Unknown numbers',goal:'Use a letter to stand for a number.',text:'A letter can hold a place for a number we want to find. In one problem, every x stands for the same number. A new problem may use a different number.',start:'x = 3 + 2',steps:[['x = 5','Three plus two is five. Now we know the mystery number.'],['5 = 3 + 2','Check: put five where x was.'],['5 = 5','The two sides match. Five works!']],note:'x is a name for a number. It is not the multiplication sign ×. A box □ and the letter x can do the same job.',ask:'Could we call this mystery number B instead of x?',lab:'substitute'},
{title:'Undo addition',tag:'04 / Find x',goal:'Leave x on its own by subtracting from both sides.',text:'In 2 + x = 3, the mystery number has two added to it. To uncover x, undo that addition. Subtract two from both sides.',start:'2 + x = 3',steps:[['2 + x − 2 = 3 − 2','Subtract two from BOTH sides.'],['x = 1','On the left, adding two and subtracting two undo each other. On the right, three minus two is one.'],['2 + 1 = 3','Check the answer in the original equation. It works!']],note:'Do not just “move the two.” Explain the real action: subtract two from each side.',ask:'Would subtracting one from both sides still keep the equation true? Would x be alone yet?',lab:'solve',eq:[1,2,3]},
{title:'Undo subtraction & groups',tag:'05 / Inverse operations',goal:'Use the opposite operation to uncover a number.',text:'If something was taken away, add it back to both sides. If there are equal groups of x, divide both sides by the number of groups.',start:'x − 3 = 4',steps:[['x − 3 + 3 = 4 + 3','Add three to each side.'],['x = 7','Seven minus three is four. Check complete.'],['2x = 8','New problem! 2x means 2 × x: two equal groups of x.'],['2x ÷ 2 = 8 ÷ 2','Divide both sides by two.'],['x = 4','Check: two groups of four make eight.']],note:'Dividing by zero is never allowed. Multiplying both sides by zero makes them equal, but hides all the information about x. We do not use it to solve.',ask:'If three identical bags hold twelve pucks, how many pucks are in each bag?',lab:'solve',eq:[2,0,8]},
{title:'Use what you know',tag:'06 / Substitution',goal:'Replace a letter with its known value.',text:'Substitution means putting a known number in place of its letter. Here we know x. That helps us find B.',start:'x = 3     and     B = 2 + x',steps:[['B = 2 + 3','Replace x with three. Keep everything else the same.'],['B = 5','Add two and three.'],['x = 3, B = 5','These are two different letters with their own values. Check: five really is two plus three.']],note:'Knowing x = 3 gives us enough information here. B = 2 + x on its own has lots of answers: x = 1, B = 3 or x = 2, B = 4, for example.',ask:'If x were four in a new problem, what would B be?',lab:'substitute'},
{title:'Turn stories into algebra',tag:'07 / Two clues',goal:'Translate a story into a picture and two equations.',text:'There are five more adults than children in a room. There are thirteen people altogether. How many adults and how many children?',start:'A = C + 5     and     A + C = 13',steps:[['(C + 5) + C = 13','A means adults. C means children. Replace A with C + 5.'],['2C + 5 = 13','C + C is two equal groups of C. We write that as 2C.'],['2C + 5 − 5 = 13 − 5','Subtract the five extra adults from both sides.'],['2C = 8','Two equal groups remain.'],['C = 4','Divide both sides by two. There are four children.'],['A = 4 + 5 = 9','There are nine adults.'],['9 + 4 = 13 and 9 − 4 = 5','Check BOTH clues: thirteen total and five more adults.']],note:'The equal parts in a bar picture are the same unknown that we call C in the equations. The picture and algebra tell the same story.',ask:'Why do we divide eight by two, instead of dividing thirteen by two?',lab:'story'},
{title:'Be an answer detective',tag:'08 / Does it make sense?',goal:'Check the arithmetic AND the meaning of an answer.',text:'Now change the story: five more adults than children, but twelve people altogether. Can that happen?',start:'A = C + 5     and     A + C = 12',steps:[['2C + 5 = 12','Substitute C + 5 for A, just as before.'],['2C = 7','Subtract five from both sides.'],['C = 3.5 and A = 8.5','Dividing by two gives three and a half children and eight and a half adults.'],['No whole-person solution','Those numbers fit the equations, but people must be counted in whole numbers. The two story clues cannot both be true.']],note:'A fraction can be a perfectly good answer for lengths or amounts of juice. It cannot be a count of whole people in this room.',ask:'Would twelve people work if there were FOUR more adults than children?',lab:'detective'}
];
let state={person:'Quinn',profiles:{}},saved=true;
try{const s=JSON.parse(localStorage.getItem('algebra-adventure-v1'));if(s&&s.profiles&&typeof s.profiles==='object')state=s;}catch(e){saved=false}
if(!['Quinn','Reagan','Guest'].includes(state.person))state.person='Quinn';
let chapter=0,step=0,practice=null,revealed=0,solved=false,lab={},guidedOpen=false;
function profile(){if(!state.profiles[state.person]||!Array.isArray(state.profiles[state.person].counts))state.profiles[state.person]={counts:Array(8).fill(0),lesson:0};return state.profiles[state.person]}
function save(){try{localStorage.setItem('algebra-adventure-v1',JSON.stringify(state));saved=true}catch(e){saved=false}$('storageNote').textContent=saved?'Works entirely offline. Progress is saved in this browser when local storage is available. Each explorer has separate progress.':'Works entirely offline. This browser is not saving progress; keep this tab open during your session.'}
function nav(){const p=profile();$('nav').innerHTML=lessons.map((l,i)=>`<button data-chapter="${i}" class="${i===chapter?'active ':''}${p.counts[i]>=3?'done':''}" ${i===chapter?'aria-current="step"':''}><span class="num">${p.counts[i]>=3?'✓':i+1}</span><span>${l.title}</span></button>`).join('')}
function render(){guidedOpen=false;$('lesson').classList.remove('hidden');$('guide').style.display='none';$('guideToggle').textContent='Grown-up guide';const l=lessons[chapter];step=0;nav();$('lesson').innerHTML=`<article class="card"><div class="eyebrow">${l.tag}</div><h2>${l.title}</h2><p><strong>Your mission:</strong> ${l.goal}</p><p>${l.text}</p><div class="equation math">${l.start}</div><ol class="steps" id="steps"></ol><div class="row"><button class="primary" id="nextStep">Show the next step</button><button id="restartSteps">Start example again</button></div><div class="callout">${l.note}</div><details><summary>Talk it through</summary><p>${l.ask}</p><p>Say what you think out loud. You can use counters, draw a picture, or explain it with numbers.</p></details></article><section class="card tint" id="lab"></section><section class="card"><div class="row spread"><h3>Your turn</h3><span class="counter" id="counter"></span></div><p class="small">Try it, ask for a hint, or uncover one solution step at a time. There is no timer.</p><div id="practice"></div></section><div class="footer"><button id="prevLesson" ${chapter===0?'disabled':''}>← Previous</button><button class="primary" id="nextLesson" ${chapter===7?'disabled':''}>Next lesson →</button></div>`;
$('nextStep').onclick=()=>{if(step<l.steps.length){const [a,b]=l.steps[step++];$('steps').insertAdjacentHTML('beforeend',`<li><strong>${a}</strong>${b}</li>`);$('nextStep').disabled=step===l.steps.length;$('nextStep').textContent=step===l.steps.length?'Example complete':`Show step ${step+1}`}};
$('restartSteps').onclick=()=>{step=0;$('steps').innerHTML='';$('nextStep').disabled=false;$('nextStep').textContent='Show the next step'};
$('prevLesson').onclick=()=>go(chapter-1);$('nextLesson').onclick=()=>go(chapter+1);renderLab();newPractice();save()}
function go(i){chapter=Math.max(0,Math.min(7,i));profile().lesson=chapter;render()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.chapter)};
$('learner').value=state.person;$('learner').onchange=()=>{state.person=$('learner').value;go(profile().lesson||0)};
function controls(){return `<div class="row"><label>Operation <select id="op"><option value="add">Add</option><option value="sub">Subtract</option><option value="mul">Multiply by</option><option value="div">Divide by</option></select></label><label>Number <input id="amount" type="number" min="1" max="20" value="2"></label><button class="primary" id="apply">Apply</button><button id="resetLab">Reset</button></div><div id="labFeedback" class="feedback" role="status"></div><ol class="log" id="log"></ol>`}
function renderLab(){const type=lessons[chapter].lab;if(type==='balance'){
lab={left:chapter===0?2:10,right:chapter===0?2:10,history:[]};$('lab').innerHTML=`<h3>Balance playground</h3><p>Try a change. Watch the amounts and the equals sign.</p><div id="balanceView"></div><label>Change <select id="target"><option value="both">Both sides</option><option value="left">Left side only — experiment</option><option value="right">Right side only — experiment</option></select></label>${controls()}<button id="undoLab">Undo last move</button>`;drawBalance();$('apply').onclick=balanceMove;$('undoLab').onclick=()=>{const old=lab.history.pop();if(old){lab.left=old.left;lab.right=old.right;$('log').lastElementChild?.remove();drawBalance();$('labFeedback').textContent='Last move undone.'}};
}else if(type==='solve'){
lab={a:lessons[chapter].eq[0],b:lessons[chapter].eq[1],c:lessons[chapter].eq[2],original:[...lessons[chapter].eq]};$('lab').innerHTML=`<h3>You control the equation</h3><p>Choose an operation. It will be applied to <strong>both sides</strong>. Your goal is x by itself.</p><div class="equation math" id="solveView"></div>${controls()}<p class="small">This first playground keeps whole-number coefficients and nonnegative amounts. The solution steps above also show how to undo subtraction.</p>`;drawSolve();$('apply').onclick=solveMove;
}else if(type==='substitute'){
$('lab').innerHTML=`<h3>Substitution machine</h3><p>Set x. Watch its number take its place in B = 2 + x.</p><label>x = <input id="xRange" type="range" min="0" max="12" value="3"></label><div id="subView"></div><p class="small">Each slider setting is a new example. Within that example, x keeps the same value.</p>`;$('xRange').oninput=drawSub;drawSub();
}else if(type==='story'){
$('lab').innerHTML=`<h3>One story, two ways</h3><p>Explore different groups. Matching green bars represent the same number.</p><div class="row"><label>Children <input id="children" type="number" min="1" max="12" value="4"></label><label>Extra adults <input id="extra" type="number" min="1" max="10" value="5"></label><button id="storyUpdate">Update picture</button></div><div id="storyView"></div>`;$('storyUpdate').onclick=drawStory;drawStory();
}else{$('lab').innerHTML=`<h3>Can the room exist?</h3><p>Keep “five more adults.” Try different totals.</p><label>Total people <input id="total" type="number" min="5" max="30" value="12"></label> <button id="detectUpdate">Investigate</button><div id="detectView" class="feedback" role="status"></div>`;$('detectUpdate').onclick=drawDetect;drawDetect()}
if($('resetLab'))$('resetLab').onclick=renderLab}
const fmt=n=>Number.isInteger(n)?String(n):String(Math.round(n*1000)/1000);
function drawBalance(){const equal=lab.left===lab.right;$('balanceView').innerHTML=`<div class="pans"><div class="pan" style="transform:translateY(${lab.left>lab.right?8:0}px)"><div class="small">LEFT</div><div class="math">${fmt(lab.left)}</div><div class="tokens">${'<i class="token"></i>'.repeat(Math.min(30,Math.floor(lab.left)))}</div></div><div class="math" aria-label="${equal?'equals':'does not equal'}">${equal?'=':'≠'}</div><div class="pan" style="transform:translateY(${lab.right>lab.left?8:0}px)"><div class="small">RIGHT</div><div class="math">${fmt(lab.right)}</div><div class="tokens">${'<i class="token"></i>'.repeat(Math.min(30,Math.floor(lab.right)))}</div></div></div><p class="small">${equal?'Same value: the equation is true.':'Different values: this is not an equality.'} Dots are counters (up to 30 per side).</p>`}
function operation(v,op,n){return op==='add'?v+n:op==='sub'?v-n:op==='mul'?v*n:v/n}
function getMove(){const n=Number($('amount').value),op=$('op').value;if(!Number.isInteger(n)||n<1||n>20){$('labFeedback').textContent='Use a whole number from 1 to 20. Zero is not a solving move here.';return null}return {n,op}}
function balanceMove(){const m=getMove();if(!m)return;const t=$('target').value,L=t==='right'?lab.left:operation(lab.left,m.op,m.n),R=t==='left'?lab.right:operation(lab.right,m.op,m.n);if(L<0||R<0||L>100||R>100||!Number.isInteger(L)||!Number.isInteger(R)){$('labFeedback').textContent='For this counter playground, keep each amount a whole number from 0 to 100. Try a different move.';return}lab.history.push({left:lab.left,right:lab.right});lab.left=L;lab.right=R;drawBalance();$('log').insertAdjacentHTML('beforeend',`<li>${m.op==='add'?'Add':m.op==='sub'?'Subtract':m.op==='mul'?'Multiply by':'Divide by'} ${m.n}; ${t} side${t==='both'?'s':''} → ${L} ${L===R?'=':'≠'} ${R}</li>`);$('labFeedback').textContent=L===R?'The values match! Both sides are equal.':'The values do not match. Can you repair the equality?'}
function expr(a,b){return (a===1?'x':`${fmt(a)}x`)+(b>0?` + ${fmt(b)}`:b<0?` − ${fmt(-b)}`:'')}
function drawSolve(){$('solveView').textContent=`${expr(lab.a,lab.b)} = ${fmt(lab.c)}`}
function solveMove(){const m=getMove();if(!m)return;let {a,b,c}=lab;const before=`${expr(a,b)} = ${c}`;if(m.op==='add'||m.op==='sub'){b=operation(b,m.op,m.n);c=operation(c,m.op,m.n)}else{a=operation(a,m.op,m.n);b=operation(b,m.op,m.n);c=operation(c,m.op,m.n)}if([a,b,c].some(v=>!Number.isInteger(v)||v<0||v>200)||a===0){$('labFeedback').textContent='That move is outside this beginner playground. Keep whole numbers and nonnegative terms. Try undoing the added amount, or dividing every term by the same factor.';return}Object.assign(lab,{a,b,c});drawSolve();const symbol={add:'+',sub:'−',mul:'×',div:'÷'}[m.op];$('log').insertAdjacentHTML('beforeend',`<li>${before}; ${symbol} ${m.n} on both sides → ${expr(a,b)} = ${c}</li>`);if(a===1&&b===0){const [oa,ob,oc]=lab.original;$('labFeedback').textContent=`Solved: x = ${c}. Check the original: ${oa} × ${c} + ${ob} = ${oc}. Both sides match!`}else $('labFeedback').textContent='Equality preserved. What can you undo next to leave x alone?'}
function drawSub(){const x=+$('xRange').value;$('subView').innerHTML=`<div class="equation math">x = ${x}<br>B = 2 + x<br>B = 2 + <span style="color:var(--green)">${x}</span><br>B = ${x+2}</div>`}
function barHTML(c,d){return `<div class="bars"><div class="barrow"><span class="barlabel">Children</span><div class="bar"><span class="part" style="flex:${c}">C = ${c}</span><span style="flex:${d}"></span></div></div><div class="barrow"><span class="barlabel">Adults</span><div class="bar"><span class="part" style="flex:${c}">C = ${c}</span><span class="part extra" style="flex:${d}">+ ${d}</span></div></div></div>`}
function drawStory(){const c=+$('children').value,d=+$('extra').value;if(!Number.isInteger(c)||!Number.isInteger(d)||c<1||c>12||d<1||d>10){$('storyView').textContent='Use 1–12 children and 1–10 extra adults.';return}$('storyView').innerHTML=`${barHTML(c,d)}<p><strong>Picture:</strong> Two matching green parts plus ${d} extras make ${2*c+d} people.</p><div class="equation math">A = C + ${d}<br>A + C = ${2*c+d}<br>2C + ${d} = ${2*c+d}</div><p>Take away ${d} extras: ${2*c} remain. Share them between two equal parts: C = ${c}. Then A = ${c+d}.</p>`}
function drawDetect(){const t=+$('total').value;if(!Number.isInteger(t)||t<5||t>30){$('detectView').textContent='Choose a whole total from 5 to 30.';return}const c=(t-5)/2;$('detectView').innerHTML=`<strong>2C + 5 = ${t} → 2C = ${t-5} → C = ${c}</strong><p>${Number.isInteger(c)?`This works: ${c} children and ${c+5} adults. Total ${t}, difference 5.`:`The equations give ${c} children and ${c+5} adults. The arithmetic works, but the story cannot count half a person.`}</p>`}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function makeProblem(ch){const x=rand(1,9),a=rand(2,6),b=rand(1,7);let q,answers,labels=['x'],hint,steps;
if(ch===0){q=`${a} + ${b} = □ + ${a}`;answers=[b];labels=['□'];hint='Work out the value on the left. The right side must have that same value.';steps=[`${a} + ${b} = ${a+b}`,`□ + ${a} must equal ${a+b}.`, `□ = ${b}; check: ${b} + ${a} = ${a+b}.`]}
if(ch===1){const t=x+b;q=`Start with ${t} = ${t}. Subtract ${b} from BOTH sides. What number is on each side now?`;answers=[x];labels=['Each side'];hint=`Calculate ${t} − ${b} on each side.`;steps=[`${t} − ${b} = ${t} − ${b}`,`${x} = ${x}. Each side is ${x}.`]}
if(ch===2){q=`x = ${a} + ${b}`;answers=[a+b];hint='The letter holds the value of the whole sum.';steps=[`${a} + ${b} = ${a+b}`,`x = ${a+b}. Check: ${a+b} = ${a} + ${b}.`]}
if(ch===3){q=`${b} + x = ${b+x}`;answers=[x];hint=`Undo “add ${b}.” What should you do to BOTH sides?`;steps=[`${b} + x − ${b} = ${b+x} − ${b}`,`x = ${x}`,`Check: ${b} + ${x} = ${b+x}.`]}
if(ch===4){if(Math.random()<.5){q=`x − ${b} = ${x}`;answers=[x+b];hint=`Undo subtracting ${b} by adding ${b} to BOTH sides.`;steps=[`x − ${b} + ${b} = ${x} + ${b}`,`x = ${x+b}`,`Check: ${x+b} − ${b} = ${x}.`]}else{q=`${a}x = ${a*x}`;answers=[x];hint=`There are ${a} equal groups of x. Divide BOTH sides by ${a}.`;steps=[`${a}x ÷ ${a} = ${a*x} ÷ ${a}`,`x = ${x}`,`Check: ${a} × ${x} = ${a*x}.`]}}
if(ch===5){q=`x = ${x}. B = ${b} + x. Find B.`;answers=[b+x];labels=['B'];hint=`Replace x with ${x}.`;steps=[`B = ${b} + ${x}`,`B = ${b+x}`,`Check: ${b+x} = ${b} + ${x}.`]}
if(ch===6){const contexts=[['adults','children','in a room'],['blue beads','red beads','in a box'],['player sticks','goalie sticks','at the rink']];const [big,small,place]=contexts[rand(0,2)];q=`There are ${b} more ${big} than ${small} ${place}. There are ${2*x+b} altogether. How many of each?`;answers=[x,x+b];labels=[small,big];hint=`Let s be the number of ${small}. Then the number of ${big} is s + ${b}.`;steps=[`s + (s + ${b}) = ${2*x+b}`,`2s + ${b} = ${2*x+b}`,`Subtract ${b} from both sides: 2s = ${2*x}`,`Divide both sides by 2: s = ${x}`,`${small}: ${x}. ${big}: ${x} + ${b} = ${x+b}.`,`Check total: ${x} + ${x+b} = ${2*x+b}. Check difference: ${x+b} − ${x} = ${b}.`]}
if(ch===7){const possible=Math.random()<.5,t=2*x+b+(possible?0:1);q=`There are ${b} more adults than children and ${t} people in total. Is a whole-person answer possible?`;answers=[possible?'yes':'no'];labels=['Possible?'];hint=`Remove the ${b} extra adults, then split the rest into two equal groups. Can each group have a whole number?`;const c=(t-b)/2;steps=[`2C + ${b} = ${t}`,`2C = ${t-b}`,`C = ${c}; A = ${c+b}`,possible?`Yes. ${c} + ${c+b} = ${t}, and the difference is ${b}.`:'No. The equations give halves of people, so the story has no whole-person solution.']}
return {q,answers,labels,hint,steps}}
function newPractice(){practice=makeProblem(chapter);revealed=0;solved=false;const p=practice;$('practice').innerHTML=`<div class="equation ${chapter<6?'math':''}">${p.q}</div><form id="answerForm"><div class="row">${p.labels.map((label,i)=>`<label>${label} ${chapter===7?`<select id="answer${i}" required><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select>`:`<input id="answer${i}" type="number" step="any" required autocomplete="off">`}</label>`).join('')}<button class="primary" type="submit">Check answer</button></div></form><div id="answerFeedback" class="feedback" role="status">What do you think? Try an answer.</div><div class="row"><button id="hint">Give me a hint</button><button id="solution">One solution step</button><button id="fresh">New problem</button></div><p id="hintText" class="small"></p><ol class="steps" id="solutionSteps"></ol>`;$('answerForm').onsubmit=e=>{e.preventDefault();checkAnswer()};$('hint').onclick=()=>{$('hintText').textContent=p.hint};$('solution').onclick=()=>{if(revealed<p.steps.length){$('solutionSteps').insertAdjacentHTML('beforeend',`<li>${p.steps[revealed++]}</li>`);$('solution').disabled=revealed===p.steps.length}};$('fresh').onclick=newPractice;counter()}
function counter(){const n=profile().counts[chapter]||0;$('counter').textContent=`${n} solved · ${n>=3?'Ready to explain it!':'Try 3, then explain one'}`}
function checkAnswer(){const p=practice,values=p.answers.map((v,i)=>typeof v==='number'?($('answer'+i).value.trim()===''?NaN:Number($('answer'+i).value)):$('answer'+i).value);const ok=values.every((v,i)=>v===p.answers[i]);$('answerFeedback').className='feedback '+(ok?'good':'try');if(ok){$('answerFeedback').textContent='That works! '+(chapter===7?'You checked whether the answer fits the story.':'Now check it in the original equation or story, and explain why it works.');if(!solved){solved=true;profile().counts[chapter]=(profile().counts[chapter]||0)+1;save();counter();nav()}}else{$('answerFeedback').textContent=chapter===6?'Not quite. Your answers must fit BOTH clues: the total and the difference. Try the hint.':chapter===0?'Not yet. Work out each side: do they have the same value?':'Not yet. Try substituting your answer back into the original problem. The hint can help.'}}
function renderGuide(){$('guide').innerHTML=`<article class="card"><div class="eyebrow">A course to do together</div><h2>Grown-up guide</h2><p><strong>The objective:</strong> understand equality, choose an operation for a reason, and check an answer. Speed is optional. This is an introductory course, not a full algebra curriculum.</p><div class="row noPrint"><button id="printGuide">Print guide & worksheet</button><button id="backCourse">Back to course</button></div><h3>Start here</h3><p>Download this HTML file and open it in a desktop browser such as Safari, Edge, Chrome, or Firefox. No installation, account, internet connection, or server is needed after download. The file contains all the lessons, styles, and code. It makes no network requests. A phone file preview may not execute the activities; use a browser that can open local HTML, or use a laptop.</p><p>Progress belongs to each named explorer in this browser. File copying, browser privacy settings, or clearing browser data may reset it. All lessons stay open; badges show practice completed, not a formal mastery assessment. Hints and revealed solutions are welcome.</p><h3>A gentle rhythm</h3><p>Aim for 10–15 minutes at a time, and split lesson 5 or 7 across days if needed. First use real counters. Then draw a picture. Then write the equation. Do one worked example together, one with help, and one independently. Before moving on, ask the child to explain a step and check an answer without a prompt.</p><h3>Eight short lessons</h3><ol>${lessons.map(l=>`<li><strong>${l.title}:</strong> ${l.goal}</li>`).join('')}</ol><h3>Connect pictures to symbols</h3><p>Use these as bridges to schoolwork: an empty box □ becomes x; a part–whole picture becomes a sum; matching bar lengths become the same letter; an extra bar becomes “+ 5.” In the room story, both green parts have length C, so the picture gives C + C + 5 = 13. No particular Singapore Math edition is assumed here.</p><p>Let children use the picture and the equation side by side. Ask “Where is this number in the picture?” and “Which equation says the same thing?” Keep their teacher's vocabulary alongside the new symbols.</p><h3>Precise language that helps</h3><ul><li>Say “has the same value as,” not “gives the answer.” Include 5 = 3 + 2.</li><li>From 2 = 2, adding five gives 2 + 5 = 2 + 5. Rewriting one side as 5 + 2 uses the order property of addition; it is a separate step.</li><li>Say “subtract two from both sides,” rather than “move the two and change the sign.”</li><li>2x means 2 × x. In the room example, 2C means two copies of the child-count, not a claim that there are literally two groups of children in the room.</li><li>A letter keeps one value within a problem. Different letters may have different values or the same value.</li><li>The substitution lesson has a known x. Two unknowns generally need more information; we do not suggest that one equation always finds both.</li><li>Adding or subtracting the same amount preserves equality. Multiplying or dividing by the same nonzero number gives an equivalent equation. Division by zero is undefined; multiplying by zero loses information.</li><li>With thirteen total and five extra adults, there are 4 children and 9 adults. With twelve total, the equations give 3.5 and 8.5: valid numbers, impossible counts of whole people.</li></ul><h3>If a child gets stuck</h3><p>Return to counters or a drawing. Cover the mystery with a cup. Ask what was done to it and how to undo that action. If the arithmetic is hard, use smaller numbers while keeping the same structure. If a child guesses correctly, ask for the check and a reason; guessing is a useful start, but explanation is the goal.</p><h3>After this course</h3><p>Next steps: two-step equations such as 2x + 3 = 11, unknowns on both sides, fractions and negative numbers, and more stories. Introduce each as another application of preserving equality. Do not rush into symbol rules before the balance idea makes sense.</p><details class="noPrint"><summary>Reset this explorer's progress</summary><p>This clears only ${state.person}'s counts and lesson position in this browser.</p><button id="resetProgress">Reset ${state.person}'s progress</button><p id="resetStatus" role="status"></p></details></article><article class="card"><h2>Paper practice</h2><p>Explain a step. Check your answer. Draw a picture when it helps.</p><ol><li>4 + 3 = □ + 4</li><li>Start with 10 = 10. Subtract 2 from both sides.</li><li>x = 3 + 2</li><li>2 + x = 3</li><li>x − 3 = 4</li><li>2x = 8</li><li>x = 3 and B = 2 + x. Find B.</li><li>There are 5 more adults than children and 13 people in total. Find both counts.</li><li>Could that same difference work with 12 people total? Explain.</li><li>There are 4 more blue beads than red beads, 16 beads altogether. Find both counts.</li></ol><details open><summary>Grown-up answer key</summary><p>1: 3 (both sides 7). 2: 8 = 8. 3: x = 5. 4: x = 1. 5: x = 7. 6: x = 4. 7: B = 5. 8: 4 children, 9 adults. 9: No whole-person solution; the equations give 3.5 children and 8.5 adults. 10: 6 red beads, 10 blue beads. For 8 and 10, check both the total and difference.</p></details></article>`;$('printGuide').onclick=()=>window.print();$('backCourse').onclick=toggleGuide;$('resetProgress').onclick=()=>{state.profiles[state.person]={counts:Array(8).fill(0),lesson:0};save();nav();$('resetStatus').textContent='Progress reset for '+state.person+'.'}}
function toggleGuide(){guidedOpen=!guidedOpen;$('lesson').classList.toggle('hidden',guidedOpen);$('guide').style.display=guidedOpen?'block':'none';$('guideToggle').textContent=guidedOpen?'Back to course':'Grown-up guide';if(guidedOpen)renderGuide()}
$('guideToggle').onclick=toggleGuide;
chapter=Math.max(0,Math.min(7,Number(profile().lesson)||0));render();renderGuide();
</script></body></html>
