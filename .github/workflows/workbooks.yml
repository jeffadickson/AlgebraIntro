name: Illustrated workbooks
on:
  push:
    branches: [main]
    paths: ['workbook/**', 'tools/build-workbook.py', 'course/lessons.json', 'tests/check-workbook.py', '.github/workflows/workbooks.yml']
  pull_request:
    paths: ['workbook/**', 'tools/build-workbook.py', 'course/lessons.json', 'tests/check-workbook.py', '.github/workflows/workbooks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r workbook/requirements.txt
      - run: python tools/build-workbook.py
      - run: python tests/check-workbook.py
      - uses: actions/upload-artifact@v4
        with:
          name: Algebra-Adventure-200-page-editions
          path: workbook/Algebra_Adventure_200_*.pdf
          if-no-files-found: error
          retention-days: 30
